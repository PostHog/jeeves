[project]
name = "jeeves-sdk"
version = "0.1.0"
description = "Drop-in replacement for the TypeSafe (Jev) Python SDK that talks to a Jeeves server and adds reasoning options."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["typesafe-sdk>=0.7.2,<0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jeeves_sdk"]
